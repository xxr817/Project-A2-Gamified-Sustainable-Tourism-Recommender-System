# Render.com blueprint for the EcoTrail FastAPI backend.
# Deploy: push this repo to GitHub -> Render -> "New +" -> "Blueprint" -> pick the repo.
# Render reads this file, builds, and starts the service. Then set OPENAI_API_KEY
# (and ALLOWED_ORIGINS) in the service's Environment tab.
services:
  - type: web
    name: ecotrail-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set manually in the dashboard (secret)
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://ecotrail.vercel.app
